<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Quick Ref</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --bg2: #141418;
  --bg3: #1c1c22;
  --bg4: #242430;
  --line: rgba(255,255,255,0.07);
  --line2: rgba(255,255,255,0.12);
  --text: #e8e8f0;
  --muted: #6a6a80;
  --accent: #7c6af7;
  --accent2: #a78bfa;
  --green: #34d399;
  --amber: #fbbf24;
  --coral: #f87171;
  --teal: #22d3ee;
  --pink: #f472b6;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  height: 100%;
  overflow: hidden;
}

/* ── Layout ── */
.shell {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 52px 1fr;
  height: 100vh;
}

/* ── Topbar ── */
.topbar {
  grid-column: 1 / -1;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  position: relative;
}

.logo {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.3px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-badge {
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 400;
  background: var(--accent);
  color: #fff;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}

.search-wrap {
  flex: 1;
  max-width: 380px;
  margin-left: 20px;
  position: relative;
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 13px;
}
#search {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 10px 7px 30px;
  outline: none;
  transition: border-color 0.2s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }

.count-badge {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-family: var(--mono);
}

/* ── Sidebar ── */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 12px 10px;
}
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

.sidebar-label {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 8px 6px;
  font-family: var(--sans);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--muted);
  transition: all 0.15s;
  border: 1px solid transparent;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active {
  background: var(--bg4);
  color: var(--text);
  border-color: var(--line2);
}
.nav-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.nav-count {
  margin-left: auto;
  font-size: 10px;
  background: var(--bg);
  border-radius: 10px;
  padding: 1px 5px;
  color: var(--muted);
}

/* ── Main content ── */
.main {
  overflow-y: auto;
  padding: 20px;
  background: var(--bg);
}
.main::-webkit-scrollbar { width: 3px; }
.main::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* ── Cards ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  display: flex;
  flex-direction: column;
}
.card:hover { border-color: var(--line2); transform: translateY(-1px); }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px 11px 14px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
  gap: 8px;
}
.card-head:hover { border-bottom-color: var(--line); }

.card-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.card-title {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cat-pill {
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 10px;
  letter-spacing: 0.5px;
  font-family: var(--mono);
  flex-shrink: 0;
  text-transform: uppercase;
}

.toggle-btn {
  font-size: 10px;
  color: var(--muted);
  transition: transform 0.2s, color 0.2s;
  flex-shrink: 0;
}
.card.open .toggle-btn { transform: rotate(90deg); color: var(--accent2); }

.card-body {
  display: none;
  padding: 12px 14px;
  flex-direction: column;
  gap: 8px;
}
.card.open .card-body { display: flex; }

.card-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  font-family: var(--mono);
}

.code-block {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre;
  overflow-x: auto;
  position: relative;
}
.code-block::-webkit-scrollbar { height: 3px; }
.code-block::-webkit-scrollbar-thumb { background: var(--bg4); }

.copy-btn {
  position: absolute;
  top: 6px; right: 6px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--muted);
  font-size: 10px;
  font-family: var(--mono);
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s, color 0.15s;
}
.code-block:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--text); }
.copy-btn.copied { color: var(--green); }

/* Syntax highlight */
.kw { color: var(--accent2); }
.fn { color: var(--teal); }
.cm { color: #4a4a60; }
.st { color: var(--green); }
.nm { color: var(--amber); }
.tp { color: var(--pink); }

.no-results {
  text-align: center;
  color: var(--muted);
  padding: 4rem;
  font-size: 13px;
  grid-column: 1 / -1;
}

/* Category colors */
.c-io    { background: #1a1a40; color: #818cf8; }
.c-loop  { background: #0f2a1f; color: #34d399; }
.c-file  { background: #2a1f0a; color: #fbbf24; }
.c-mem   { background: #2a0f1a; color: #f472b6; }
.c-str   { background: #1a0a2a; color: #a78bfa; }
.c-cond  { background: #0a2020; color: #22d3ee; }
.c-data  { background: #2a1a0a; color: #fb923c; }
.c-func  { background: #1a1a1a; color: #9ca3af; }
.c-t2    { background: #0a1f2a; color: #38bdf8; }
.c-algo  { background: #2a1500; color: #f97316; }

.dot-io   { background: #818cf8; }
.dot-loop { background: #34d399; }
.dot-file { background: #fbbf24; }
.dot-mem  { background: #f472b6; }
.dot-str  { background: #a78bfa; }
.dot-cond { background: #22d3ee; }
.dot-data { background: #fb923c; }
.dot-func { background: #9ca3af; }
.dot-t2   { background: #38bdf8; }
.dot-algo { background: #f97316; }

/* Expand all toggle */
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 12px;
}
.action-btn {
  font-size: 11px;
  font-family: var(--mono);
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.action-btn:hover { color: var(--text); background: var(--bg4); }
</style>
</head>
<body>
<div class="shell">

  <!-- Topbar -->
  <header class="topbar">
    <div class="logo">
      C++ Ref <span class="logo-badge">v2.0</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" placeholder="Search functions, keywords…" oninput="render()" />
    </div>
    <div class="topbar-actions">
      <button class="action-btn" onclick="expandAll()">expand all</button>
      <button class="action-btn" onclick="collapseAll()">collapse all</button>
    </div>
    <span class="count-badge" id="counter"></span>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- Main -->
  <main class="main" id="main"></main>

</div>

<script>
const cats = [
  { id: "all",  label: "All", dot: "dot-func" },
  { id: "io",   label: "I/O", dot: "dot-io" },
  { id: "loop", label: "Loops", dot: "dot-loop" },
  { id: "file", label: "File I/O", dot: "dot-file" },
  { id: "mem",  label: "Memory", dot: "dot-mem" },
  { id: "str",  label: "Strings", dot: "dot-str" },
  { id: "cond", label: "Conditionals", dot: "dot-cond" },
  { id: "data", label: "Data Structures", dot: "dot-data" },
  { id: "func", label: "Functions", dot: "dot-func" },
  { id: "t2",   label: "Tier 2 Essentials", dot: "dot-t2" },
  { id: "algo", label: "Algorithms", dot: "dot-algo" },
];

const baseData = [
  // I/O
  { cat:"io", title:"cin / cout", desc:"Read from stdin and write to stdout — the most common I/O pair.", code:
`#include <iostream>
using namespace std;

int main() {
    int x;
    cout << "Enter a number: ";
    cin >> x;
    cout << "You entered: " << x << "\\n";

    int a, b;
    cin >> a >> b;
    cout << "Sum: " << a + b << "\\n";
    return 0;
}` },
  { cat:"io", title:"getline", desc:"Read a whole line including spaces — cin>> stops at whitespace.", code:
`#include <iostream>
#include <string>
using namespace std;

int main() {
    string line;
    cout << "Enter a sentence: ";
    getline(cin, line);
    cout << "You said: " << line << "\\n";

    // after cin>>, flush the newline first:
    int n;
    cin >> n;
    cin.ignore();
    getline(cin, line);
    return 0;
}` },
  { cat:"io", title:"printf / scanf", desc:"C-style formatted I/O — faster than cout in competitive programming.", code:
`#include <cstdio>

int main() {
    int n;
    scanf("%d", &n);
    printf("val: %d\\n", n);

    double d;
    scanf("%lf", &d);
    printf("double: %.2f\\n", d);

    // format specifiers:
    // %d int   %f float   %lf double
    // %c char  %s string  %ld long
    return 0;
}` },
  { cat:"io", title:"cerr / clog", desc:"Write errors/logs to stderr — separate from normal cout output.", code:
`#include <iostream>
using namespace std;

int main() {
    int x = 42;
    cerr << "Error: file not found\\n"; // unbuffered stderr
    clog << "Debug: x = " << x << "\\n"; // buffered stderr
    cout << "Normal output\\n";           // stdout
    return 0;
}` },

  // Loops
  { cat:"loop", title:"for loop", desc:"Classic counted loop — use when you know the iteration count.", code:
`#include <iostream>
using namespace std;

int main() {
    // forward
    for (int i = 0; i < 5; i++) {
        cout << i << " "; // 0 1 2 3 4
    }
    cout << "\\n";

    // reverse
    for (int i = 4; i >= 0; i--) {
        cout << i << " "; // 4 3 2 1 0
    }
    cout << "\\n";

    // step by 2
    for (int i = 0; i < 10; i += 2) {
        cout << i << " "; // 0 2 4 6 8
    }
    return 0;
}` },
  { cat:"loop", title:"while loop", desc:"Loop while a condition is true — use when count is unknown.", code:
`#include <iostream>
using namespace std;

int main() {
    int x = 1;
    while (x < 100) {
        x *= 2;
    }
    cout << x << "\\n"; // 128

    // read until EOF (Ctrl+D / Ctrl+Z to stop):
    int val, sum = 0;
    while (cin >> val) {
        sum += val;
    }
    cout << "Sum: " << sum << "\\n";
    return 0;
}` },
  { cat:"loop", title:"do-while loop", desc:"Body runs at least once before checking the condition.", code:
`#include <iostream>
using namespace std;

int main() {
    int choice;
    do {
        cout << "Enter 1 to continue, 0 to quit: ";
        cin >> choice;
    } while (choice != 0);

    cout << "Done\\n";
    return 0;
}` },
  { cat:"loop", title:"range-for (C++11)", desc:"Iterate over every element in a container — cleanest syntax.", code:
`#include <iostream>
#include <vector>
using namespace std;

int main() {
    vector<int> v = {1, 2, 3, 4, 5};

    // read-only
    for (int x : v) {
        cout << x << " "; // 1 2 3 4 5
    }
    cout << "\\n";

    // modify elements — use reference:
    for (int& x : v) {
        x *= 2;
    }
    for (int x : v) {
        cout << x << " "; // 2 4 6 8 10
    }
    return 0;
}` },
  { cat:"loop", title:"break / continue", desc:"break exits the loop; continue skips to the next iteration.", code:
`#include <iostream>
using namespace std;

int main() {
    for (int i = 0; i < 10; i++) {
        if (i == 7) break;         // stop at 7
        if (i % 2 == 0) continue;  // skip even numbers
        cout << i << " "; // prints 1 3 5
    }
    cout << "\\n";
    return 0;
}` },

  // File I/O
  { cat:"file", title:"fstream (C++)", desc:"Object-oriented file reading and writing — preferred in C++.", code:
`#include <iostream>
#include <fstream>
#include <string>
using namespace std;

int main() {
    // write to file
    ofstream out("out.txt");
    out << "hello world\\n";
    out << "line two\\n";
    out.close();

    // read line by line
    ifstream in("out.txt");
    string line;
    while (getline(in, line)) {
        cout << line << "\\n";
    }
    in.close();
    return 0;
}` },
  { cat:"file", title:"fopen / fclose (C)", desc:"C-style file handling — lower level, good to know.", code:
`#include <cstdio>

int main() {
    FILE* f = fopen("data.txt", "r"); // r w a rb wb
    if (!f) {
        printf("Error: could not open file\\n");
        return 1;
    }

    char buf[256];
    while (fgets(buf, sizeof(buf), f)) {
        printf("%s", buf);
    }
    fclose(f);
    return 0;
}` },
  { cat:"file", title:"read full file", desc:"Slurp an entire file into a string in one shot.", code:
`#include <iostream>
#include <fstream>
#include <sstream>
#include <string>
using namespace std;

int main() {
    ifstream in("file.txt");
    if (!in) { cerr << "Cannot open file\\n"; return 1; }

    ostringstream ss;
    ss << in.rdbuf();
    string content = ss.str();

    cout << content;
    return 0;
}` },
  { cat:"file", title:"check file exists", desc:"Before opening, verify the file is there.", code:
`#include <iostream>
#include <fstream>
#include <string>
using namespace std;

bool exists(const string& name) {
    ifstream f(name);
    return f.good();
}

int main() {
    if (exists("data.txt")) {
        cout << "File found\\n";
    } else {
        cout << "File not found\\n";
    }
    return 0;
}` },
  { cat:"file", title:"write modes", desc:"Understand mode flags for fopen and ofstream.", code:
`#include <fstream>
#include <iostream>
using namespace std;

int main() {
    // truncate (overwrite)
    ofstream f1("file.txt");
    f1 << "fresh start\\n";
    f1.close();

    // append — keeps existing content
    ofstream f2("file.txt", ios::app);
    f2 << "appended line\\n";
    f2.close();

    // fopen modes:
    // "r"  read text      "rb" read binary
    // "w"  write (trunc)  "a"  append
    // "r+" read+write     "w+" write+read
    return 0;
}` },

  // Memory
  { cat:"mem", title:"new / delete", desc:"Dynamic allocation on the heap — always pair them to avoid leaks.", code:
`#include <iostream>
using namespace std;

int main() {
    int* p = new int(42);    // single int
    cout << *p << "\\n";     // 42
    delete p;

    int* arr = new int[5]{1,2,3,4,5};
    for (int i = 0; i < 5; i++)
        cout << arr[i] << " ";
    cout << "\\n";
    delete[] arr;            // note []
    return 0;
}` },
  { cat:"mem", title:"malloc / free (C)", desc:"C-style raw memory allocation — no constructors called.", code:
`#include <cstdlib>
#include <cstring>
#include <cstdio>

int main() {
    int* p = (int*)malloc(sizeof(int) * 5);
    if (!p) { printf("alloc failed\\n"); return 1; }

    memset(p, 0, sizeof(int) * 5); // zero out
    p[2] = 99;
    printf("%d\\n", p[2]); // 99
    free(p);
    return 0;
}` },
  { cat:"mem", title:"unique_ptr (C++11)", desc:"Smart pointer — automatically frees memory, no leaks ever.", code:
`#include <iostream>
#include <memory>
using namespace std;

int main() {
    auto p = make_unique<int>(42);
    cout << *p << "\\n"; // 42
    // freed automatically when p goes out of scope

    auto arr = make_unique<int[]>(5);
    arr[0] = 10;
    arr[1] = 20;
    cout << arr[0] << " " << arr[1] << "\\n";
    return 0;
}` },
  { cat:"mem", title:"shared_ptr", desc:"Reference-counted smart pointer — multiple owners, freed when last goes.", code:
`#include <iostream>
#include <memory>
using namespace std;

int main() {
    auto p1 = make_shared<int>(42);
    auto p2 = p1;  // both own the int
    cout << *p1 << "\\n";         // 42
    cout << p1.use_count() << "\\n"; // 2
    p1.reset(); // p1 releases ownership
    cout << p2.use_count() << "\\n"; // 1
    return 0;
}` },
  { cat:"mem", title:"memcpy / memset", desc:"Low-level block memory operations — fast for raw bytes.", code:
`#include <cstring>
#include <cstdio>

int main() {
    char src[] = "hello";
    char dst[6];
    memcpy(dst, src, 6);          // copy 6 bytes
    printf("copied: %s\\n", dst); // hello

    memset(dst, 0, sizeof(dst));  // fill with zeros
    printf("cleared: %s\\n", dst); // (empty)
    return 0;
}` },

  // Strings
  { cat:"str", title:"std::string basics", desc:"C++ string — knows its own length, safe and easy to use.", code:
`#include <iostream>
#include <string>
using namespace std;

int main() {
    string s = "hello";
    s += " world";
    cout << s << "\\n";           // hello world
    cout << s.length() << "\\n";  // 11
    cout << s[0] << "\\n";        // h
    cout << s.substr(6, 5) << "\\n"; // world
    cout << s.find("wor") << "\\n";  // 6
    return 0;
}` },
  { cat:"str", title:"string ↔ number", desc:"Convert between strings and numbers.", code:
`#include <iostream>
#include <string>
using namespace std;

int main() {
    // string to number
    int n    = stoi("42");
    double d = stod("3.14");
    long l   = stol("999999");
    cout << n << " " << d << " " << l << "\\n";

    // number to string
    string s = to_string(42);
    string f = to_string(3.14);
    cout << s << " " << f << "\\n";
    return 0;
}` },
  { cat:"str", title:"string split", desc:"C++ has no built-in split — use stringstream.", code:
`#include <iostream>
#include <sstream>
#include <string>
#include <vector>
using namespace std;

int main() {
    string line = "apple,banana,cherry";
    stringstream ss(line);
    string token;
    vector<string> parts;

    while (getline(ss, token, ',')) {
        parts.push_back(token);
    }

    for (const string& p : parts) {
        cout << p << "\\n"; // apple / banana / cherry
    }
    return 0;
}` },
  { cat:"str", title:"char utilities", desc:"Classify and transform individual characters.", code:
`#include <iostream>
#include <cctype>
using namespace std;

int main() {
    char c = 'A';
    cout << isalpha(c) << "\\n";  // 1 (true)
    cout << isdigit('3') << "\\n"; // 1
    cout << isupper(c) << "\\n";  // 1
    cout << (char)tolower(c) << "\\n"; // a
    cout << (char)toupper('z') << "\\n"; // Z
    cout << isspace(' ') << "\\n"; // 1
    return 0;
}` },
  { cat:"str", title:"C-string (char*)", desc:"Older C-style strings — you'll encounter these in legacy code.", code:
`#include <cstring>
#include <cstdio>

int main() {
    char s[] = "hello";
    printf("len: %zu\\n", strlen(s)); // 5

    char dst[20];
    strcpy(dst, s);           // copy
    strcat(dst, " world");    // concatenate
    printf("%s\\n", dst);     // hello world

    printf("%d\\n", strcmp("abc", "abc")); // 0 = equal
    printf("%d\\n", strcmp("b", "a"));     // positive
    return 0;
}` },
  { cat:"str", title:"string replace", desc:"Replace a substring within a string.", code:
`#include <iostream>
#include <string>
using namespace std;

int main() {

`#include <iostream>
#include <vector>
using namespace std;

// returns index of target, or -1 if not found
int binarySearch(vector<int>& arr, int target) {
    int lo = 0, hi = arr.size() - 1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2; // avoids overflow
        if (arr[mid] == target) return mid;
        else if (arr[mid] < target) lo = mid + 1;
        else hi = mid - 1;
    }
    return -1;
}

    return 0;

void bubbleSort(vector<int>& arr) {
    int n = arr.size();
    for (int i = 0; i < n - 1; i++) {
        bool swapped = false;
        for (int j = 0; j < n - i - 1; j++) {
            if (arr[j] > arr[j+1]) {
                swap(arr[j], arr[j+1]);
                swapped = true;
            }

`#include <iostream>
#include <vector>
using namespace std;

void merge(vector<int>& arr, int l, int m, int r) {
    vector<int> left(arr.begin()+l, arr.begin()+m+1);
    vector<int> right(arr.begin()+m+1, arr.begin()+r+1);
    int i=0, j=0, k=l;
    while (i<left.size() && j<right.size())
        arr[k++] = (left[i]<=right[j]) ? left[i++] : right[j++];
    while (i<left.size())  arr[k++] = left[i++];
    while (j<right.size()) arr[k++] = right[j++];
}

void mergeSort(vector<int>& arr, int l, int r) {
    if (l >= r) return;
    int m = l + (r - l) / 2;
    mergeSort(arr, l, m);
    mergeSort(arr, m+1, r);
    merge(arr, l, m, r);
}

`#include <iostream>
#include <vector>
using namespace std;

// max sum of subarray of size k
int maxSumWindow(vector<int>& arr, int k) {
    int n = arr.size();
    if (n < k) return -1;

    // sum first window
    int windowSum = 0;
    for (int i = 0; i < k; i++) windowSum += arr[i];

    int maxSum = windowSum;

    // slide the window
    for (int i = k; i < n; i++) {
        windowSum += arr[i] - arr[i - k]; // add new, remove old
        maxSum = max(maxSum, windowSum);
    }
    return maxSum;
}

`#include <iostream>
#include <vector>
using namespace std;

// Classic: 0/1 knapsack — max value with weight limit
int knapsack(vector<int>& weights, vector<int>& values, int capacity) {
    int n = weights.size();
    vector<vector<int>> dp(n+1, vector<int>(capacity+1, 0));

    for (int i = 1; i <= n; i++) {
        for (int w = 0; w <= capacity; w++) {
            dp[i][w] = dp[i-1][w]; // don't take item i
            if (weights[i-1] <= w)
                dp[i][w] = max(dp[i][w],
                    dp[i-1][w-weights[i-1]] + values[i-1]); // take it
        }
    }
    return dp[n][capacity];
}

const data = [...baseData, ...t2Data, ...algoData];
let activeFilter = "all";
const openCards = new Set();

function catConfig(id) {
  const map = {
    io:   { pill:"c-io",   dot:"dot-io"   },
    loop: { pill:"c-loop", dot:"dot-loop" },
    file: { pill:"c-file", dot:"dot-file" },
    mem:  { pill:"c-mem",  dot:"dot-mem"  },
    str:  { pill:"c-str",  dot:"dot-str"  },
    cond: { pill:"c-cond", dot:"dot-cond" },
    data: { pill:"c-data", dot:"dot-data" },
    func: { pill:"c-func", dot:"dot-func" },
    t2:   { pill:"c-t2",   dot:"dot-t2"   },
    algo: { pill:"c-algo", dot:"dot-algo" },
  };
  return map[id] || { pill:"c-func", dot:"dot-func" };
}

function catLabel(id) {
  const m = {
    io:"I/O", loop:"Loops", file:"File I/O", mem:"Memory",
    str:"Strings", cond:"Conditionals", data:"Data Structures",
    func:"Functions", t2:"Tier 2", algo:"Algorithm"
  };
  return m[id] || id;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(code) {
  // Tokenise raw code, then escape each token individually
  const tokens = [];
  let rest = code;

  const rules = [
    { cls: 'cm', re: /^\/\/[^\n]*/ },
    { cls: 'st', re: /^"(?:[^"\\]|\\.)*"/ },
    { cls: 'st', re: /^'[^']*'/ },
    { cls: 'kw', re: /^#?\b(include|int|double|float|char|bool|void|string|auto|const|using|namespace|return|if|else|while|for|do|break|continue|switch|case|default|new|delete|nullptr|true|false|class|struct|template|typename|std|size_t|long|short|unsigned)\b/ },
    { cls: 'nm', re: /^\b\d+(\.\d+)?\b/ },
  ];

  while (rest.length) {
    let matched = false;
    for (const rule of rules) {
      const m = rest.match(rule.re);
      if (m) {
        tokens.push(`<span class="${rule.cls}">${escHtml(m[0])}</span>`);
        rest = rest.slice(m[0].length);
        matched = true;
        break;
      }
    }
    if (!matched) {
      tokens.push(escHtml(rest[0]));
      rest = rest.slice(1);
    }
  }
  return tokens.join('');
}

function buildSidebar() {
  const counts = {};
  data.forEach(d => { counts[d.cat] = (counts[d.cat]||0) + 1; });
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = `<div class="sidebar-label">Categories</div>` +
    cats.map(c => {
      const cnt = c.id === "all" ? data.length : (counts[c.id]||0);
      const cfg = catConfig(c.id);
      return `<div class="nav-item ${activeFilter===c.id?'active':''}" onclick="setFilter('${c.id}')">
        <span class="nav-dot ${cfg.dot}"></span>
        ${c.label}
        <span class="nav-count">${cnt}</span>
      </div>`;
    }).join("");
}

function render() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const main = document.getElementById("main");

  let items = data.filter(d => {
    if (activeFilter !== "all" && d.cat !== activeFilter) return false;
    if (q) return d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.code.toLowerCase().includes(q);
    return true;
  });

  document.getElementById("counter").textContent = `${items.length} snippets`;

  if (!items.length) {
    main.innerHTML = `<div class="grid"><div class="no-results">no results for "${q}"</div></div>`;
    return;
  }

  main.innerHTML = `<div class="grid">${items.map(item => {
    const id = item.cat + "_" + item.title.replace(/\W+/g,"_");
    const isOpen = openCards.has(id);
    const cfg = catConfig(item.cat);
    return `<div class="card ${isOpen?'open':''}" id="card_${id}">
      <div class="card-head" onclick="toggleCard('${id}')">
        <div class="card-title-row">
          <span class="cat-pill ${cfg.pill}">${catLabel(item.cat)}</span>
          <span class="card-title">${item.title}</span>
        </div>
        <span class="toggle-btn">▶</span>
      </div>
      <div class="card-body">
        <p class="card-desc">${item.desc}</p>
        <div class="code-block" id="code_${id}"><code>${highlight(item.code)}</code><button class="copy-btn" onclick="copyCode(event,'${id}')">copy</button></div>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function toggleCard(id) {
  if (openCards.has(id)) openCards.delete(id);
  else openCards.add(id);
  render();
}

function setFilter(cat) {
  activeFilter = cat;
  buildSidebar();
  render();
}

function expandAll() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  data.filter(d => {
    if (activeFilter !== "all" && d.cat !== activeFilter) return false;
    if (q) return d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.code.toLowerCase().includes(q);
    return true;
  }).forEach(d => {
    const id = d.cat + "_" + d.title.replace(/\W+/g,"_");
    openCards.add(id);
  });
  render();
}

function collapseAll() {
  openCards.clear();
  render();
}

function copyCode(e, id) {
  e.stopPropagation();
  const el = document.getElementById("code_" + id);
  const text = el.querySelector("code").innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.querySelector(".copy-btn");
    btn.textContent = "copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1500);
  });
}

// keyboard shortcut: / to focus search
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== document.getElementById("search")) {
    e.preventDefault();
    document.getElementById("search").focus();
  }
  if (e.key === "Escape") document.getElementById("search").blur();
});

buildSidebar();
render();
</script>
