<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Ref — C++ & Python</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0f;
  --bg2: #141418;
  --bg3: #1c1c22;
  --bg4: #242430;
  --line: rgba(255,255,255,0.07);
  --line2: rgba(255,255,255,0.12);
  --text: #e8e8f0;
  --muted: #6a6a80;
  --accent: #7c6af7;
  --accent2: #a78bfa;
  --green: #34d399;
  --amber: #fbbf24;
  --coral: #f87171;
  --teal: #22d3ee;
  --pink: #f472b6;
  --py-accent: #7aa2f7;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Syne', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  height: 100%;
  overflow: hidden;
}

/* ── Layout ── */
.shell {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 52px 1fr;
  height: 100vh;
}

/* ── Topbar ── */
.topbar {
  grid-column: 1 / -1;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  position: relative;
}

.logo {
  font-family: var(--sans);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.3px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.logo-badge {
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 400;
  background: var(--accent);
  color: #fff;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  transition: background 0.25s;
}
.logo-badge.py { background: var(--py-accent); }

/* ── Language switcher ── */
.lang-switch {
  display: flex;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
  flex-shrink: 0;
}
.lang-btn {
  font-size: 11px;
  font-family: var(--mono);
  font-weight: 500;
  padding: 4px 12px;
  border-radius: 5px;
  border: none;
  cursor: pointer;
  transition: all 0.18s;
  color: var(--muted);
  background: transparent;
  letter-spacing: 0.3px;
}
.lang-btn:hover { color: var(--text); }
.lang-btn.active-cpp { background: var(--accent); color: #fff; }
.lang-btn.active-py  { background: var(--py-accent); color: #0d0d0f; }

/* ── Search ── */
.search-wrap {
  flex: 1;
  max-width: 360px;
  margin-left: 4px;
  position: relative;
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 13px;
  pointer-events: none;
}
#search {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--line2);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 10px 7px 30px;
  outline: none;
  transition: border-color 0.2s;
}
#search:focus { border-color: var(--accent); }
#search.py-focus:focus { border-color: var(--py-accent); }
#search::placeholder { color: var(--muted); }

.count-badge {
  margin-left: auto;
  font-size: 11px;
  color: var(--muted);
  font-family: var(--mono);
}

/* ── Topbar actions ── */
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 4px;
}
.action-btn {
  font-size: 11px;
  font-family: var(--mono);
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--muted);
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.action-btn:hover { color: var(--text); background: var(--bg4); }

/* ── Sidebar ── */
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 12px 10px;
}
.sidebar::-webkit-scrollbar { width: 3px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

.sidebar-label {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 8px 6px;
  font-family: var(--sans);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  color: var(--muted);
  transition: all 0.15s;
  border: 1px solid transparent;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bg4); color: var(--text); border-color: var(--line2); }
.nav-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.nav-count {
  margin-left: auto;
  font-size: 10px;
  background: var(--bg);
  border-radius: 10px;
  padding: 1px 5px;
  color: var(--muted);
}

/* ── Main ── */
.main {
  overflow-y: auto;
  padding: 20px;
  background: var(--bg);
}
.main::-webkit-scrollbar { width: 3px; }
.main::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

/* ── Cards ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  display: flex;
  flex-direction: column;
}
.card:hover { border-color: var(--line2); transform: translateY(-1px); }

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
  gap: 8px;
}
.card-head:hover { border-bottom-color: var(--line); }

.card-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.card-title {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cat-pill {
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 10px;
  letter-spacing: 0.5px;
  font-family: var(--mono);
  flex-shrink: 0;
  text-transform: uppercase;
}

.toggle-btn {
  font-size: 10px;
  color: var(--muted);
  transition: transform 0.2s, color 0.2s;
  flex-shrink: 0;
}
.card.open .toggle-btn { transform: rotate(90deg); color: var(--accent2); }
.card.open.py-card .toggle-btn { color: var(--py-accent); }

.card-body {
  display: none;
  padding: 12px 14px;
  flex-direction: column;
  gap: 8px;
}
.card.open .card-body { display: flex; }

.card-desc {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  font-family: var(--mono);
}

.code-block {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre;
  overflow-x: auto;
  position: relative;
  font-family: var(--mono);
}
.code-block::-webkit-scrollbar { height: 3px; }
.code-block::-webkit-scrollbar-thumb { background: var(--bg4); }

.copy-btn {
  position: absolute;
  top: 6px; right: 6px;
  background: var(--bg3);
  border: 1px solid var(--line2);
  color: var(--muted);
  font-size: 10px;
  font-family: var(--mono);
  padding: 3px 8px;
  border-radius: 4px;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.2s, color 0.15s;
}
.code-block:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--text); }
.copy-btn.copied { color: var(--green); }

/* ── C++ Syntax highlight ── */
.kw { color: var(--accent2); }
.fn { color: var(--teal); }
.cm { color: #4a4a60; }
.st { color: var(--green); }
.nm { color: var(--amber); }
.tp { color: var(--pink); }

/* ── Python Syntax highlight (scoped) ── */
.py-hl .kw  { color: #bb9af7; }
.py-hl .fn  { color: #7aa2f7; }
.py-hl .str { color: #9ece6a; }
.py-hl .cm  { color: #565f89; font-style: italic; }
.py-hl .num { color: #ff9e64; }
.py-hl .cl  { color: #e0af68; }
.py-hl .bl  { color: #f7768e; }

/* ── No results ── */
.no-results {
  text-align: center;
  color: var(--muted);
  padding: 4rem;
  font-size: 13px;
  grid-column: 1 / -1;
}

/* ═══════════════════════════════════════
   C++ category pills + dots
═══════════════════════════════════════ */
.c-io    { background: #1a1a40; color: #818cf8; }

═══════════════════════════════════════ */
.c-py-strings      { background: #0d1e3e; color: #7aa2f7; }
.c-py-lists        { background: #142b10; color: #9ece6a; }

</style>
</head>
<body>
<div class="shell">

  <!-- Topbar -->
  <header class="topbar">
    <div class="logo">
      <span id="logo-lang">C++</span> Ref
      <span class="logo-badge" id="lang-badge">v2.0</span>
    </div>
    <div class="lang-switch">
      <button class="lang-btn active-cpp" id="btn-cpp" onclick="setLang('cpp')">C++</button>
      <button class="lang-btn" id="btn-py"  onclick="setLang('py')">Python</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="search" placeholder="Search functions, keywords…" oninput="render()" />
    </div>
    <div class="topbar-actions">
      <button class="action-btn" onclick="expandAll()">expand all</button>
      <button class="action-btn" onclick="collapseAll()">collapse all</button>
    </div>
    <span class="count-badge" id="counter"></span>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- Main -->
  <main class="main" id="main"></main>

</div>
<script>
// ── Category definitions ─────────────────────────────
const cppCats = [
  { id:"all",  label:"All",              dot:"dot-func" },
  { id:"io",   label:"I/O",             dot:"dot-io"   },
  { id:"loop", label:"Loops",           dot:"dot-loop" },
  { id:"file", label:"File I/O",        dot:"dot-file" },
  { id:"mem",  label:"Memory",          dot:"dot-mem"  },
  { id:"str",  label:"Strings",         dot:"dot-str"  },
  { id:"cond", label:"Conditionals",    dot:"dot-cond" },
  { id:"data", label:"Data Structures", dot:"dot-data" },
  { id:"func", label:"Functions",       dot:"dot-func" },
  { id:"t2",   label:"Tier 2",          dot:"dot-t2"   },
  { id:"algo", label:"Algorithms",      dot:"dot-algo" },
];

const pyCats = [
  { id:"all",            label:"All",            dot:"dot-func"              },
  { id:"strings",        label:"Strings",        dot:"dot-py-strings"        },
  { id:"lists",          label:"Lists",          dot:"dot-py-lists"          },
  { id:"dicts",          label:"Dicts",          dot:"dot-py-dicts"          },
  { id:"control",        label:"Control",        dot:"dot-py-control"        },
  { id:"functions",      label:"Functions",      dot:"dot-py-functions"      },
  { id:"comprehensions", label:"Comprehensions", dot:"dot-py-comprehensions" },
  { id:"classes",        label:"Classes",        dot:"dot-py-classes"        },
  { id:"builtins",       label:"Builtins",       dot:"dot-py-builtins"       },
  { id:"io",             label:"I/O",            dot:"dot-py-io"             },
  { id:"exceptions",     label:"Exceptions",     dot:"dot-py-exceptions"     },
  { id:"async",          label:"Async",          dot:"dot-py-async"          },
  { id:"stdlib",         label:"Stdlib",         dot:"dot-py-stdlib"         },
  { id:"typing",         label:"Typing",         dot:"dot-py-typing"         },
  { id:"debugging",      label:"Debugging",      dot:"dot-py-debugging"      },
  { id:"numpy",          label:"NumPy",          dot:"dot-py-numpy"          },
  { id:"pandas",         label:"Pandas",         dot:"dot-py-pandas"         },
  { id:"functools",      label:"Functools",      dot:"dot-py-functools"      },
  { id:"concurrency",    label:"Concurrency",    dot:"dot-py-concurrency"    },
  { id:"networking",     label:"Networking",     dot:"dot-py-networking"     },
  { id:"testing",        label:"Testing",        dot:"dot-py-testing"        },
  { id:"torch",          label:"PyTorch",        dot:"dot-py-torch"          },
  { id:"pydantic",       label:"Pydantic",       dot:"dot-py-pydantic"       },
  { id:"text",           label:"Text",           dot:"dot-py-text"           },
];

// ── C++ DATA ─────────────────────────────────────────
const cppData = [
  // I/O
  { cat:"io", title:"cin / cout", desc:"Read from stdin and write to stdout — the most common I/O pair.", code:
`#include <iostream>
using namespace std;

int main() {
    int x;
    cout << "Enter a number: ";
    cin >> x;
    cout << "You entered: " << x << "\\n";

    int a, b;
    cin >> a >> b;
    cout << "Sum: " << a + b << "\\n";
    return 0;
}` },
  { cat:"io", title:"getline", desc:"Read a whole line including spaces — cin>> stops at whitespace.", code:
`#include <iostream>
#include <string>
using namespace std;

int main() {
    string line;
    cout << "Enter a sentence: ";
    getline(cin, line);
    cout << "You said: " << line << "\\n";

    int n;
    cin >> n;
    cin.ignore();
    getline(cin, line);
    return 0;
}` },
  { cat:"io", title:"printf / scanf", desc:"C-style formatted I/O — faster than cout in competitive programming.", code:
`#include <cstdio>

int main() {
    int n;
    scanf("%d", &n);
    printf("val: %d\\n", n);

    double d;
    scanf("%lf", &d);
    printf("double: %.2f\\n", d);

    // %d int   %f float   %lf double
    // %c char  %s string  %ld long
    return 0;
}` },
  { cat:"io", title:"cerr / clog", desc:"Write errors/logs to stderr — separate from normal cout output.", code:
`#include <iostream>
using namespace std;

int main() {
    int x = 42;
    cerr << "Error: file not found\\n"; // unbuffered stderr
    clog << "Debug: x = " << x << "\\n"; // buffered stderr
    cout << "Normal output\\n";
    return 0;
}` },

  // Loops
  { cat:"loop", title:"for loop", desc:"Classic counted loop — use when you know the iteration count.", code:
`#include <iostream>
using namespace std;

int main() {
    for (int i = 0; i < 5; i++) {
        cout << i << " "; // 0 1 2 3 4
    }
    cout << "\\n";

    for (int i = 4; i >= 0; i--) {
        cout << i << " "; // 4 3 2 1 0
    }
    cout << "\\n";

    for (int i = 0; i < 10; i += 2) {
        cout << i << " "; // 0 2 4 6 8
    }
    return 0;
}` },
  { cat:"loop", title:"while loop", desc:"Loop while a condition is true — use when count is unknown.", code:
`#include <iostream>
using namespace std;

int main() {
    int x = 1;
    while (x < 100) {
        x *= 2;
    }
    cout << x << "\\n"; // 128

    int val, sum = 0;
    while (cin >> val) {
        sum += val;
    }
    cout << "Sum: " << sum << "\\n";
    return 0;
}` },
  { cat:"loop", title:"do-while loop", desc:"Body runs at least once before checking the condition.", code:
`#include <iostream>
using namespace std;

int main() {
    int choice;
    do {
        cout << "Enter 1 to continue, 0 to quit: ";
        cin >> choice;
    } while (choice != 0);

    cout << "Done\\n";
    return 0;
}` },
  { cat:"loop", title:"range-for (C++11)", desc:"Iterate over every element in a container — cleanest syntax.", code:
`#include <iostream>
#include <vector>
using namespace std;

int main() {
    vector<int> v = {1, 2, 3, 4, 5};

    for (int x : v) {
        cout << x << " "; // 1 2 3 4 5
    }
    cout << "\\n";

    for (int& x : v) {
        x *= 2;
    }
    for (int x : v) {
        cout << x << " "; // 2 4 6 8 10
    }
    return 0;
}` },
  { cat:"loop", title:"break / continue", desc:"break exits the loop; continue skips to the next iteration.", code:
`#include <iostream>
using namespace std;

int main() {
    for (int i = 0; i < 10; i++) {
        if (i == 7) break;
        if (i % 2 == 0) continue;
        cout << i << " "; // 1 3 5
    }
    cout << "\\n";
    return 0;
}` },

  // File I/O
  { cat:"file", title:"fstream (C++)", desc:"Object-oriented file reading and writing — preferred in C++.", code:
`#include <iostream>
#include <fstream>
#include <string>
using namespace std;

int main() {
    ofstream out("out.txt");
    out << "hello world\\n";
    out << "line two\\n";
    out.close();

    ifstream in("out.txt");
    string line;
    while (getline(in, line)) {
        cout << line << "\\n";
    }
    in.close();
    return 0;
}` },
  { cat:"file", title:"fopen / fclose (C)", desc:"C-style file handling — lower level, good to know.", code:
`#include <cstdio>

int main() {
    FILE* f = fopen("data.txt", "r");
    if (!f) {
        printf("Error: could not open file\\n");

  { cat:"algo", title:"binary search", desc:"Find a value in a sorted array in O(log n) — much faster than linear scan.", code:
`#include <iostream>
#include <vector>
using namespace std;

int binarySearch(vector<int>& arr, int target) {
    int lo = 0, hi = arr.size() - 1;
    while (lo <= hi) {
        int mid = lo + (hi - lo) / 2;
        if (arr[mid] == target) return mid;
        else if (arr[mid] < target) lo = mid + 1;
        else hi = mid - 1;
    }
    return -1;
}

int main() {
    vector<int> v = {1, 3, 5, 7, 9, 11, 13};
    cout << binarySearch(v, 7)  << "\\n"; // 3
    cout << binarySearch(v, 6)  << "\\n"; // -1
    return 0;
}` },
  { cat:"algo", title:"bubble sort", desc:"Simple O(n²) sort — great for learning, too slow for large data.", code:
`#include <iostream>
#include <vector>
using namespace std;

void bubbleSort(vector<int>& arr) {
    int n = arr.size();
    for (int i = 0; i < n - 1; i++) {
        bool swapped = false;
        for (int j = 0; j < n - i - 1; j++) {
            if (arr[j] > arr[j+1]) {
                swap(arr[j], arr[j+1]);
                swapped = true;
            }
        }
        if (!swapped) break;
    }

`#include <iostream>
#include <vector>
using namespace std;

void merge(vector<int>& arr, int l, int m, int r) {
    vector<int> left(arr.begin()+l, arr.begin()+m+1);
    vector<int> right(arr.begin()+m+1, arr.begin()+r+1);
    int i=0, j=0, k=l;
    while (i<(int)left.size() && j<(int)right.size())
        arr[k++] = (left[i]<=right[j]) ? left[i++] : right[j++];
    while (i<(int)left.size())  arr[k++] = left[i++];
    while (j<(int)right.size()) arr[k++] = right[j++];
}

void mergeSort(vector<int>& arr, int l, int r) {
    if (l >= r) return;
    int m = l + (r - l) / 2;
    mergeSort(arr, l, m);
    mergeSort(arr, m+1, r);
    merge(arr, l, m, r);
}

`#include <iostream>
#include <vector>
using namespace std;

int maxSumWindow(vector<int>& arr, int k) {
    int n = arr.size();
    if (n < k) return -1;

    int windowSum = 0;
    for (int i = 0; i < k; i++) windowSum += arr[i];

    int maxSum = windowSum;
    for (int i = k; i < n; i++) {
        windowSum += arr[i] - arr[i - k];

`#include <iostream>
#include <vector>
using namespace std;

int knapsack(vector<int>& weights, vector<int>& values, int cap) {
    int n = weights.size();
    vector<vector<int>> dp(n+1, vector<int>(cap+1, 0));

    for (int i = 1; i <= n; i++) {
        for (int w = 0; w <= cap; w++) {
            dp[i][w] = dp[i-1][w];
            if (weights[i-1] <= w)
                dp[i][w] = max(dp[i][w],
                    dp[i-1][w-weights[i-1]] + values[i-1]);
        }
    }
    return dp[n][cap];
}

int main() {

    cout << knapsack(w, v, 7) << "\\n"; // 9

int lcs(const string& a, const string& b) {

    for (int i = 1; i <= m; i++)

bool isPrime(int n) {
    if (n < 2) return false;
    for (int i = 2; i * i <= n; i++)
        if (n % i == 0) return false;
    return true;
}

vector<bool> sieve(int N) {
    vector<bool> is_prime(N+1, true);
    is_prime[0] = is_prime[1] = false;
    for (int i = 2; i * i <= N; i++)

// ── State ─────────────────────────────────────────────
let activeLang   = 'cpp';
let activeFilter = 'all';
const openCards  = new Set();

// ── Helpers ───────────────────────────────────────────
function getActiveCats() { return activeLang === 'cpp' ? cppCats : pyCats; }
function getActiveData() { return activeLang === 'cpp' ? cppData : pyData; }

function catConfig(id) {
  if (activeLang === 'cpp') {
    const m = {
      io:{pill:"c-io",dot:"dot-io"}, loop:{pill:"c-loop",dot:"dot-loop"},
      file:{pill:"c-file",dot:"dot-file"}, mem:{pill:"c-mem",dot:"dot-mem"},
      str:{pill:"c-str",dot:"dot-str"}, cond:{pill:"c-cond",dot:"dot-cond"},
      data:{pill:"c-data",dot:"dot-data"}, func:{pill:"c-func",dot:"dot-func"},
      t2:{pill:"c-t2",dot:"dot-t2"}, algo:{pill:"c-algo",dot:"dot-algo"},
    };
    return m[id] || {pill:"c-func",dot:"dot-func"};
  } else {
    const m = {
      strings:{pill:"c-py-strings",dot:"dot-py-strings"},
      lists:{pill:"c-py-lists",dot:"dot-py-lists"},
      dicts:{pill:"c-py-dicts",dot:"dot-py-dicts"},
      control:{pill:"c-py-control",dot:"dot-py-control"},
      functions:{pill:"c-py-functions",dot:"dot-py-functions"},
      comprehensions:{pill:"c-py-comprehensions",dot:"dot-py-comprehensions"},
      classes:{pill:"c-py-classes",dot:"dot-py-classes"},
      builtins:{pill:"c-py-builtins",dot:"dot-py-builtins"},
      io:{pill:"c-py-io",dot:"dot-py-io"},
      exceptions:{pill:"c-py-exceptions",dot:"dot-py-exceptions"},
      async:{pill:"c-py-async",dot:"dot-py-async"},
      stdlib:{pill:"c-py-stdlib",dot:"dot-py-stdlib"},
      typing:{pill:"c-py-typing",dot:"dot-py-typing"},
      debugging:{pill:"c-py-debugging",dot:"dot-py-debugging"},
      numpy:{pill:"c-py-numpy",dot:"dot-py-numpy"},
      pandas:{pill:"c-py-pandas",dot:"dot-py-pandas"},
      functools:{pill:"c-py-functools",dot:"dot-py-functools"},
      concurrency:{pill:"c-py-concurrency",dot:"dot-py-concurrency"},
      networking:{pill:"c-py-networking",dot:"dot-py-networking"},
      testing:{pill:"c-py-testing",dot:"dot-py-testing"},
      torch:{pill:"c-py-torch",dot:"dot-py-torch"},
      pydantic:{pill:"c-py-pydantic",dot:"dot-py-pydantic"},
      text:{pill:"c-py-text",dot:"dot-py-text"},
    };
    return m[id] || {pill:"c-py-text",dot:"dot-py-text"};
  }
}

function catLabel(id) {
  if (activeLang === 'cpp') {
    const m = {
      io:"I/O",loop:"Loops",file:"File I/O",mem:"Memory",str:"Strings",
      cond:"Cond",data:"Data",func:"Func",t2:"Tier 2",algo:"Algo"
    };
    return m[id] || id;
  } else {
    const m = {
      strings:"Str",lists:"List",dicts:"Dict",control:"Ctrl",
      functions:"Fn",comprehensions:"Comp",classes:"Class",builtins:"Builtins",
      io:"I/O",exceptions:"Exc",async:"Async",stdlib:"Stdlib",
      typing:"Type",debugging:"Debug",numpy:"NumPy",pandas:"Pandas",
      functools:"Func",concurrency:"Conc",networking:"Net",
      testing:"Test",torch:"Torch",pydantic:"Pydantic",text:"Text"
    };
    return m[id] || id;
  }
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(code) {
  const tokens = [];
  let rest = code;
  const rules = [
    { cls:'cm', re:/^\/\/[^\n]*/ },
    { cls:'st', re:/^"(?:[^"\\]|\\.)*"/ },
    { cls:'st', re:/^'[^']*'/ },
    { cls:'kw', re:/^#?\b(include|int|double|float|char|bool|void|string|auto|const|using|namespace|return|if|else|while|for|do|break|continue|switch|case|default|new|delete|nullptr|true|false|class|struct|template|typename|std|size_t|long|short|unsigned)\b/ },
    { cls:'nm', re:/^\b\d+(\.\d+)?\b/ },
  ];
  while (rest.length) {
    let matched = false;
    for (const rule of rules) {
      const m = rest.match(rule.re);
      if (m) {
        tokens.push(`<span class="${rule.cls}">${escHtml(m[0])}</span>`);
        rest = rest.slice(m[0].length);
        matched = true;
        break;
      }
    }
    if (!matched) { tokens.push(escHtml(rest[0])); rest = rest.slice(1); }
  }
  return tokens.join('');
}

// ── Language switch ────────────────────────────────────
function setLang(lang) {
  activeLang = lang;
  activeFilter = 'all';
  openCards.clear();

  const isCpp = lang === 'cpp';
  document.getElementById('btn-cpp').className = 'lang-btn' + (isCpp ? ' active-cpp' : '');
  document.getElementById('btn-py').className  = 'lang-btn' + (!isCpp ? ' active-py' : '');
  document.getElementById('logo-lang').textContent = isCpp ? 'C++' : 'Python';
  const badge = document.getElementById('lang-badge');
  badge.textContent = isCpp ? 'v2.0' : '3.x';
  badge.className = 'logo-badge' + (isCpp ? '' : ' py');
  const searchEl = document.getElementById('search');
  searchEl.className = isCpp ? '' : 'py-focus';
  searchEl.placeholder = isCpp ? 'Search functions, keywords…' : 'Search snippets…';

  buildSidebar();
  render();
}

// ── Sidebar ────────────────────────────────────────────
function buildSidebar() {
  const cats  = getActiveCats();
  const items = getActiveData();
  const counts = {};
  items.forEach(d => { counts[d.cat] = (counts[d.cat]||0) + 1; });

  const sidebar = document.getElementById('sidebar');
  const langLabel = activeLang === 'cpp' ? 'C++ Categories' : 'Python Categories';
  sidebar.innerHTML = `<div class="sidebar-label">${langLabel}</div>` +
    cats.map(c => {
      const cnt = c.id === 'all' ? items.length : (counts[c.id]||0);
      const cfg = catConfig(c.id);
      return `<div class="nav-item ${activeFilter===c.id?'active':''}" onclick="setFilter('${c.id}')">
        <span class="nav-dot ${cfg.dot}"></span>
        ${c.label}
        <span class="nav-count">${cnt}</span>
      </div>`;
    }).join('');
}

// ── Render ─────────────────────────────────────────────
function render() {
  const q    = document.getElementById('search').value.toLowerCase().trim();
  const main = document.getElementById('main');
  const items = getActiveData().filter(d => {
    if (activeFilter !== 'all' && d.cat !== activeFilter) return false;
    if (q) return d.title.toLowerCase().includes(q)
                || d.desc.toLowerCase().includes(q)
                || d.code.toLowerCase().includes(q);
    return true;
  });

  document.getElementById('counter').textContent = `${items.length} snippets`;

  if (!items.length) {
    main.innerHTML = `<div class="grid"><div class="no-results">no results for "${escHtml(q)}"</div></div>`;
    return;
  }

  const isPy = activeLang === 'py';
  main.innerHTML = `<div class="grid">${items.map(item => {
    const id     = item.cat + '_' + item.title.replace(/\W+/g,'_');
    const isOpen = openCards.has(id);
    const cfg    = catConfig(item.cat);
    const codeContent = isPy ? item.code : highlight(item.code);
    const hlClass = isPy ? ' py-hl' : '';
    const cardClass = isPy ? ' py-card' : '';
    return `<div class="card${cardClass}${isOpen?' open':''}" id="card_${id}">
      <div class="card-head" onclick="toggleCard('${id}')">
        <div class="card-title-row">
          <span class="cat-pill ${cfg.pill}">${catLabel(item.cat)}</span>
          <span class="card-title">${escHtml(item.title)}</span>
        </div>
        <span class="toggle-btn">▶</span>
      </div>
      <div class="card-body">
        <p class="card-desc">${escHtml(item.desc)}</p>
        <div class="code-block${hlClass}" id="code_${id}"><code>${codeContent}</code><button class="copy-btn" onclick="copyCode(event,'${id}')">copy</button></div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── Card interactions ──────────────────────────────────
function toggleCard(id) {
  if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
  render();
}
function setFilter(cat) {
  activeFilter = cat;
  buildSidebar();
  render();
}
function expandAll() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  getActiveData().filter(d => {
    if (activeFilter !== 'all' && d.cat !== activeFilter) return false;
    if (q) return d.title.toLowerCase().includes(q)||d.desc.toLowerCase().includes(q)||d.code.toLowerCase().includes(q);
    return true;
  }).forEach(d => openCards.add(d.cat+'_'+d.title.replace(/\W+/g,'_')));
  render();
}
function collapseAll() { openCards.clear(); render(); }
function copyCode(e, id) {
  e.stopPropagation();
  const el   = document.getElementById('code_' + id);
  const text = el.querySelector('code').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.querySelector('.copy-btn');
    btn.textContent = 'copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// keyboard: / to focus search, Escape to blur
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault(); document.getElementById('search').focus();
  }
  if (e.key === 'Escape') document.getElementById('search').blur();
});

// ── Init ──────────────────────────────────────────────
buildSidebar();
render();
</script>
