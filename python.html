<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Quick Ref</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f14;
    --surface: #15161e;
    --card: #1a1b26;
    --border: #2a2b3d;
    --accent: #7aa2f7;
    --accent2: #9ece6a;
    --accent3: #f7768e;
    --accent4: #e0af68;
    --accent5: #bb9af7;
    --text: #c0caf5;
    --muted: #565f89;
    --tag-bg: #1e2030;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* Header */
  header {
    padding: 48px 40px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo-area h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #fff;
  }

  .logo-area h1 span {
    color: var(--accent);
  }

  .logo-area p {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .version-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--muted);
  }

  /* Search + filter */
  .controls {
    padding: 24px 40px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 220px;
    max-width: 380px;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
    font-family: 'JetBrains Mono', monospace;
  }

  input[type="text"] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px 10px 40px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"]::placeholder { color: var(--muted); }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0e0f14; }

  /* Count */
  .count-bar {
    padding: 14px 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  /* Grid */
  .grid {
    padding: 32px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: default;
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.3s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card-header {
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }

  .card:not(.collapsed) .card-header {
    border-bottom: 1px solid var(--border);
  }

  .card-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .chevron {
    color: var(--muted);
    font-size: 0.7rem;
    transition: transform 0.25s ease;
    flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }

  .card.collapsed .chevron { transform: rotate(-90deg); }

  /* Collapsible body */
  .card-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.28s ease, opacity 0.28s ease;
    opacity: 1;
  }

  .card.collapsed .card-body {
    grid-template-rows: 0fr;
    opacity: 0;
  }

  .card-body-inner {
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card-title {
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .card-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .tag-strings   { background: rgba(122,162,247,0.15); color: var(--accent); }
  .tag-lists     { background: rgba(158,206,106,0.15); color: var(--accent2); }
  .tag-dicts     { background: rgba(247,118,142,0.15); color: var(--accent3); }
  .tag-control   { background: rgba(224,175,104,0.15); color: var(--accent4); }
  .tag-functions { background: rgba(187,154,247,0.15); color: var(--accent5); }
  .tag-io        { background: rgba(122,162,247,0.12); color: #73daca; }
  .tag-classes   { background: rgba(247,118,142,0.12); color: #ff9e64; }
  .tag-builtins  { background: rgba(158,206,106,0.12); color: #b4f9f8; }
  .tag-exceptions{ background: rgba(224,175,104,0.12); color: #f7768e; }
  .tag-comprehensions { background: rgba(187,154,247,0.12); color: #c0caf5; }
  .tag-async    { background: rgba(115,218,202,0.15); color: #73daca; }
  .tag-stdlib   { background: rgba(224,175,104,0.15); color: var(--accent4); }
  .tag-typing   { background: rgba(122,162,247,0.15); color: var(--accent); }
  .tag-debugging{ background: rgba(247,118,142,0.15); color: var(--accent3); }
  .tag-numpy    { background: rgba(158,206,106,0.15); color: var(--accent2); }
  .tag-pandas      { background: rgba(122,162,247,0.15); color: #7dcfff; }
  .tag-functools   { background: rgba(187,154,247,0.15); color: var(--accent5); }
  .tag-concurrency { background: rgba(247,118,142,0.15); color: #ff9e64; }
  .tag-networking  { background: rgba(115,218,202,0.15); color: #73daca; }
  .tag-testing     { background: rgba(158,206,106,0.15); color: var(--accent2); }
  .tag-torch       { background: rgba(247,118,142,0.15); color: var(--accent3); }
  .tag-pydantic    { background: rgba(224,175,104,0.15); color: var(--accent4); }
  .tag-text        { background: rgba(192,202,245,0.12); color: var(--text); }

  .card-desc {
    padding: 10px 16px 8px;
    font-size: 0.78rem;
    color: var(--muted);
    line-height: 1.5;
  }

  pre {
    margin: 0 12px 12px;
    background: #0d0e12;
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.7;
    border: 1px solid #1e2030;
    flex: 1;
    position: relative;
  }

  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--border);
    border: none;
    border-radius: 5px;
    padding: 3px 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .copy-btn:hover { background: var(--accent); color: #0e0f14; }
  .copy-btn.copied { background: var(--accent2); color: #0e0f14; }

  /* Syntax highlighting */
  .kw  { color: #bb9af7; }
  .fn  { color: #7aa2f7; }
  .str { color: #9ece6a; }
  .cm  { color: #565f89; font-style: italic; }
  .num { color: #ff9e64; }
  .cl  { color: #e0af68; }
  .bl  { color: #f7768e; }

  /* Empty state */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
  }

  /* Footer */
  footer {
    padding: 32px 40px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    header, .controls, .count-bar, .grid, footer { padding-left: 16px; padding-right: 16px; }
    header { padding-top: 24px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <h1>py<span>.</span>ref</h1>
    <p>// quick reference for when your brain goes blank</p>
  </div>
  <span class="version-badge">Python 3.x</span>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="search cards..." />
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="strings">Strings</button>
    <button class="filter-btn" data-cat="lists">Lists</button>
    <button class="filter-btn" data-cat="dicts">Dicts</button>
    <button class="filter-btn" data-cat="control">Control</button>
    <button class="filter-btn" data-cat="functions">Functions</button>
    <button class="filter-btn" data-cat="comprehensions">Comprehensions</button>
    <button class="filter-btn" data-cat="classes">Classes</button>
    <button class="filter-btn" data-cat="builtins">Builtins</button>
    <button class="filter-btn" data-cat="io">I/O</button>
    <button class="filter-btn" data-cat="exceptions">Exceptions</button>
    <button class="filter-btn" data-cat="async">Async</button>
    <button class="filter-btn" data-cat="stdlib">Stdlib</button>
    <button class="filter-btn" data-cat="typing">Typing</button>
    <button class="filter-btn" data-cat="debugging">Debugging</button>
    <button class="filter-btn" data-cat="numpy">NumPy</button>
    <button class="filter-btn" data-cat="pandas">Pandas</button>
    <button class="filter-btn" data-cat="functools">Functools</button>
    <button class="filter-btn" data-cat="concurrency">Concurrency</button>
    <button class="filter-btn" data-cat="networking">Networking</button>
    <button class="filter-btn" data-cat="testing">Testing</button>
    <button class="filter-btn" data-cat="torch">PyTorch</button>
    <button class="filter-btn" data-cat="pydantic">Pydantic</button>
    <button class="filter-btn" data-cat="text">Text</button>
  </div>
</div>

<div class="count-bar" id="countBar">— cards</div>

<div class="grid" id="grid"></div>

<footer>built for when syntax escapes you mid-flow · sheikhmunim</footer>

<script>
const cards = [
  // ── STRINGS ──────────────────────────────────────────
  {
    title: "String Methods",
    cat: "strings",
    desc: "Common string operations and methods.",
    code: `s = <span class="str">"hello world"</span>
s.upper()          <span class="cm"># "HELLO WORLD"</span>
s.lower()          <span class="cm"># "hello world"</span>
s.strip()          <span class="cm"># remove whitespace</span>
s.replace(<span class="str">"l"</span>, <span class="str">"r"</span>)  <span class="cm"># "herro worrd"</span>
s.split(<span class="str">" "</span>)       <span class="cm"># ["hello", "world"]</span>
s.startswith(<span class="str">"h"</span>)  <span class="cm"># True</span>
s.find(<span class="str">"world"</span>)    <span class="cm"># 6</span>
len(s)             <span class="cm"># 11</span>`
  },
  {
    title: "f-strings",
    cat: "strings",
    desc: "Format strings with expressions inline.",
    code: `name = <span class="str">"Sheikh"</span>
score = <span class="num">42.567</span>

<span class="cm"># basic</span>
<span class="fn">print</span>(<span class="str">f"Hello, {name}!"</span>)

<span class="cm"># formatting</span>
<span class="fn">print</span>(<span class="str">f"Score: {score:.2f}"</span>)  <span class="cm"># 42.57</span>
<span class="fn">print</span>(<span class="str">f"{name!r}"</span>)           <span class="cm"># 'Sheikh'</span>
<span class="fn">print</span>(<span class="str">f"{score:>10.1f}"</span>)     <span class="cm"># right-align</span>
<span class="fn">print</span>(<span class="str">f"{2 ** 10 = }"</span>)       <span class="cm"># debug: 2**10=1024</span>`
  },
  {
    title: "String Slicing",
    cat: "strings",
    desc: "Index and slice strings efficiently.",
    code: `s = <span class="str">"python"</span>
s[<span class="num">0</span>]      <span class="cm"># 'p'</span>
s[-<span class="num">1</span>]     <span class="cm"># 'n'</span>
s[<span class="num">1</span>:<span class="num">4</span>]    <span class="cm"># 'yth'</span>
s[:<span class="num">3</span>]     <span class="cm"># 'pyt'</span>
s[<span class="num">3</span>:]     <span class="cm"># 'hon'</span>
s[::-<span class="num">1</span>]   <span class="cm"># 'nohtyp' (reverse)</span>
s[::<span class="num">2</span>]    <span class="cm"># 'pto' (every 2nd)</span>`
  },
  {
    title: "join & split",
    cat: "strings",
    desc: "Convert between strings and lists.",
    code: `words = [<span class="str">"cat"</span>, <span class="str">"dog"</span>, <span class="str">"bird"</span>]

<span class="cm"># join list → string</span>
result = <span class="str">", "</span>.join(words)
<span class="cm"># "cat, dog, bird"</span>

<span class="cm"># split string → list</span>
line = <span class="str">"a,b,c"</span>
parts = line.split(<span class="str">","</span>)
<span class="cm"># ["a", "b", "c"]</span>

<span class="cm"># split with max splits</span>
<span class="str">"a:b:c"</span>.split(<span class="str">":"</span>, <span class="num">1</span>)
<span class="cm"># ["a", "b:c"]</span>`
  },

  // ── LISTS ────────────────────────────────────────────
  {
    title: "List Operations",
    cat: "lists",
    desc: "Core list manipulation methods.",
    code: `lst = [<span class="num">3</span>, <span class="num">1</span>, <span class="num">4</span>, <span class="num">1</span>, <span class="num">5</span>]

lst.append(<span class="num">9</span>)        <span class="cm"># add to end</span>
lst.insert(<span class="num">0</span>, <span class="num">99</span>)   <span class="cm"># insert at index</span>
lst.pop()            <span class="cm"># remove & return last</span>
lst.pop(<span class="num">0</span>)          <span class="cm"># remove & return index 0</span>
lst.remove(<span class="num">1</span>)       <span class="cm"># remove first occurrence</span>
lst.sort()           <span class="cm"># in-place sort</span>
lst.reverse()        <span class="cm"># in-place reverse</span>
lst.index(<span class="num">4</span>)        <span class="cm"># find index of value</span>
lst.count(<span class="num">1</span>)        <span class="cm"># count occurrences</span>`
  },
  {
    title: "List Slicing & Copy",
    cat: "lists",
    desc: "Slicing, copying, and unpacking lists.",
    code: `lst = [<span class="num">0</span>, <span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>]

lst[<span class="num">1</span>:<span class="num">3</span>]          <span class="cm"># [1, 2]</span>
lst[-<span class="num">2</span>:]          <span class="cm"># [3, 4]</span>
lst[::<span class="num">2</span>]          <span class="cm"># [0, 2, 4]</span>

<span class="cm"># shallow copy</span>
copy = lst[:]
copy = lst.copy()

<span class="cm"># unpack</span>
a, b, *rest = lst
<span class="cm"># a=0, b=1, rest=[2,3,4]</span>

<span class="cm"># zip two lists</span>
<span class="fn">list</span>(<span class="fn">zip</span>([<span class="num">1</span>,<span class="num">2</span>], [<span class="str">"a"</span>,<span class="str">"b"</span>]))
<span class="cm"># [(1,'a'), (2,'b')]</span>`
  },
  {
    title: "Sorting",
    cat: "lists",
    desc: "Sort lists with keys and custom logic.",
    code: `nums = [<span class="num">3</span>, <span class="num">1</span>, <span class="num">4</span>, <span class="num">1</span>, <span class="num">5</span>]

<span class="cm"># returns new list</span>
<span class="fn">sorted</span>(nums)
<span class="fn">sorted</span>(nums, reverse=<span class="bl">True</span>)

<span class="cm"># sort by key</span>
words = [<span class="str">"banana"</span>, <span class="str">"fig"</span>, <span class="str">"apple"</span>]
<span class="fn">sorted</span>(words, key=<span class="fn">len</span>)
<span class="cm"># ['fig', 'apple', 'banana']</span>

<span class="cm"># sort list of dicts</span>
people = [{<span class="str">"age"</span>: <span class="num">30</span>}, {<span class="str">"age"</span>: <span class="num">25</span>}]
<span class="fn">sorted</span>(people, key=<span class="kw">lambda</span> x: x[<span class="str">"age"</span>])`
  },

  // ── DICTS ────────────────────────────────────────────
  {
    title: "Dict Operations",
    cat: "dicts",
    desc: "Creating and manipulating dictionaries.",
    code: `d = {<span class="str">"name"</span>: <span class="str">"Munim"</span>, <span class="str">"age"</span>: <span class="num">25</span>}

d[<span class="str">"city"</span>] = <span class="str">"Melbourne"</span>  <span class="cm"># add key</span>
d.get(<span class="str">"age"</span>)            <span class="cm"># 25 (safe)</span>
d.get(<span class="str">"x"</span>, <span class="num">0</span>)          <span class="cm"># 0 (default)</span>
d.pop(<span class="str">"age"</span>)           <span class="cm"># removes & returns</span>
d.keys()                <span class="cm"># dict_keys([...])</span>
d.values()              <span class="cm"># dict_values([...])</span>
d.items()               <span class="cm"># dict_items([...])</span>
d.update({<span class="str">"x"</span>: <span class="num">1</span>})     <span class="cm"># merge/update</span>
<span class="str">"name"</span> <span class="kw">in</span> d           <span class="cm"># True</span>`
  },
  {
    title: "Dict Merge & Unpack",
    cat: "dicts",
    desc: "Modern dict merging patterns.",
    code: `a = {<span class="str">"x"</span>: <span class="num">1</span>, <span class="str">"y"</span>: <span class="num">2</span>}
b = {<span class="str">"y"</span>: <span class="num">99</span>, <span class="str">"z"</span>: <span class="num">3</span>}

<span class="cm"># merge (Python 3.9+)</span>
merged = a | b
<span class="cm"># {"x":1, "y":99, "z":3}</span>

<span class="cm"># unpack merge</span>
merged = {**a, **b}

<span class="cm"># setdefault</span>
d = {}
d.setdefault(<span class="str">"count"</span>, <span class="num">0</span>)
d[<span class="str">"count"</span>] += <span class="num">1</span>

<span class="cm"># defaultdict</span>
<span class="kw">from</span> collections <span class="kw">import</span> defaultdict
dd = defaultdict(<span class="fn">list</span>)
dd[<span class="str">"a"</span>].append(<span class="num">1</span>)`
  },

  // ── CONTROL ──────────────────────────────────────────
  {
    title: "for / while loops",
    cat: "control",
    desc: "Loop patterns including enumerate and range.",
    code: `<span class="cm"># basic range</span>
<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">5</span>): ...      <span class="cm"># 0–4</span>
<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">1</span>, <span class="num">6</span>): ...  <span class="cm"># 1–5</span>
<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="num">0</span>, <span class="num">10</span>, <span class="num">2</span>): ... <span class="cm"># even</span>

<span class="cm"># enumerate</span>
<span class="kw">for</span> i, val <span class="kw">in</span> <span class="fn">enumerate</span>(lst):
    <span class="fn">print</span>(i, val)

<span class="cm"># while with break/continue</span>
<span class="kw">while</span> <span class="bl">True</span>:
    <span class="kw">if</span> done: <span class="kw">break</span>
    <span class="kw">if</span> skip: <span class="kw">continue</span>`
  },
  {
    title: "Conditionals",
    cat: "control",
    desc: "if/elif/else, ternary, and match-case.",
    code: `<span class="cm"># standard</span>
<span class="kw">if</span> x > <span class="num">0</span>:
    <span class="fn">print</span>(<span class="str">"positive"</span>)
<span class="kw">elif</span> x == <span class="num">0</span>:

// ── Render ──────────────────────────────────────────────
let currentCat = "all";
let currentSearch = "";

function renderCards() {
  const grid = document.getElementById("grid");
  const bar = document.getElementById("countBar");
  const q = currentSearch.toLowerCase();

  const filtered = cards.filter(c => {
    const catMatch = currentCat === "all" || c.cat === currentCat;
    const searchMatch = !q || c.title.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q);
    return catMatch && searchMatch;
  });

  bar.textContent = `${filtered.length} card${filtered.length !== 1 ? "s" : ""}`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">no cards found for "${currentSearch}"</div>`;
    return;
  }

  grid.innerHTML = filtered.map((c, i) => `
    <div class="card" style="animation-delay:${i * 30}ms" onclick="toggleCard(event, this)">
      <div class="card-header">
        <div class="card-header-left">
          <span class="card-title">${c.title}</span>
          <div class="card-tags">
            <span class="tag tag-${c.cat}">${c.cat}</span>
          </div>
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          <p class="card-desc">${c.desc}</p>
          <pre><button class="copy-btn" onclick="copyCode(event, this)">copy</button><code>${c.code}</code></pre>
        </div>
      </div>
    </div>
  `).join("");
}

function toggleCard(e, card) {
  card.classList.toggle("collapsed");
}

function copyCode(e, btn) {
  e.stopPropagation();
  const code = btn.nextElementSibling.innerText;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = "✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("copied"); }, 1500);
  });
}

document.getElementById("searchInput").addEventListener("input", e => {
  currentSearch = e.target.value;
  renderCards();
});

document.getElementById("filters").addEventListener("click", e => {
  if (!e.target.matches(".filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentCat = e.target.dataset.cat;
  renderCards();
});

renderCards();
</script>
